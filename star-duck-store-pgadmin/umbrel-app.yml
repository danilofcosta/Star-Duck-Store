version: "1.0.0"
port: 5400
description: >-
  Banco de dados PostgreSQL para a Star Duck Store, com a interface web do
  pgAdmin 4 para gerenciar bancos de dados, tabelas, usuários e consultas
  (queries) diretamente pelo navegador.


  Para começar, faça login no pgAdmin com o e-mail e a senha exibidos abaixo.
  Em seguida, adicione um novo servidor usando o host `db`, usuário `postgres`
  e a senha do banco de dados.


  ---


  Postgres ícones criados por [amoghdesign](https://www.flaticon.com/authors/amoghdesign) - [Flaticon](https://www.flaticon.com)


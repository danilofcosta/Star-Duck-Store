manifestVersion: 1
id: star-duck-store-pgadmin
name: pgAdmin
tagline: Banco de dados PostgreSQL com pgAdmin no seu Umbrel
icon: https://raw.githubusercontent.com/danilofcosta/Star-Duck-Store/master/star-duck-store-pgadmin/base-de-dados.png
category: Development
version: "1.0.1"
port: 5400
description: >-
  Banco de dados PostgreSQL para a Star Duck Store, com a interface web do
  pgAdmin 4 para gerenciar bancos de dados, tabelas, usuários e consultas
  (queries) diretamente pelo navegador.


  Para começar, faça login no pgAdmin com o e-mail e a senha exibidos abaixo.
  Em seguida, adicione um novo servidor usando o host `db`, usuário `postgres`
  e a senha do banco de dados.


  ---


  Postgres ícones criados por [amoghdesign](https://www.flaticon.com/authors/amoghdesign) - [Flaticon](https://www.flaticon.com)

developer: Danilo Costa
website: https://github.com/danilofcosta
submitter: Star Duck Store
submission: https://github.com/danilofcosta/Star-Duck-Store
repo: https://github.com/danilofcosta/Star-Duck-Store
support: https://github.com/danilofcosta/Star-Duck-Store/issues
gallery:
  - https://raw.githubusercontent.com/danilofcosta/Star-Duck-Store/master/star-duck-store-pgadmin/gallery/screenshot.webp
  - https://raw.githubusercontent.com/danilofcosta/Star-Duck-Store/master/star-duck-store-pgadmin/gallery/640px-pgadmin.png
  - https://raw.githubusercontent.com/danilofcosta/Star-Duck-Store/master/star-duck-store-pgadmin/gallery/image-2_orig.webp
releaseNotes: >-
  Versão 1.0.1: Correção de estrutura para compatibilidade com Umbrel App Store
  - Adicionado exports.sh obrigatório
  - Docker Compose atualizado para v3.7 com healthchecks
  - Banco PostgreSQL na porta 5433
dependencies: []
path: ""
defaultUsername: "admin@admin.com"
defaultPassword: "admin"
initScript: |
  # Create data directories
  mkdir -p "${APP_DATA_DIR}/postgres"
  mkdir -p "${APP_DATA_DIR}/pgadmin"
  chown -R 1000:1000 "${APP_DATA_DIR}/postgres"
  chown -R 5050:5050 "${APP_DATA_DIR}/pgadmin"
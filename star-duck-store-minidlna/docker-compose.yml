version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: localhost
      APP_PORT: 8250
      PROXY_AUTH_ADD: "false"

  minidlna:
    image: ghcr.io/danilofcosta/minidlna-umbrel:latest
    container_name: minidlna
    user: "1000:1000"
    init: true
    restart: on-failure
    stop_grace_period: 30s
    network_mode: host
    volumes:
      - ${APP_DATA_DIR}/data/minidlna:/config
      - ${APP_DATA_DIR}/data/media:/media
      - ${UMBREL_ROOT}/data/storage/downloads:/media/downloads
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - MINIDLNA_HOST=localhost
      - MINIDLNA_PORT=8200
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8200/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
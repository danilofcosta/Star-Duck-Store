[supervisord]
nodaemon=true
logfile=/config/log/supervisord.log
logfile_maxbytes=10MB
logfile_backups=3
loglevel=info
pidfile=/run/supervisord.pid
user=appuser

[program:minidlna]
command=/usr/sbin/minidlnad -f /config/minidlna.conf -P /run/minidlna/minidlna.pid -S
user=appuser
autostart=true
autorestart=true
startsecs=5
startretries=3
stdout_logfile=/config/log/minidlna.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/config/log/minidlna.err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
environment=HOME="/home/appuser"

[program:webui]
command=gunicorn --bind 0.0.0.0:8250 --workers 2 --timeout 60 --access-logfile /config/log/webui-access.log --error-logfile /config/log/webui-error.log app:app
directory=/app
user=appuser
autostart=true
autorestart=true
startsecs=3
startretries=3
environment=HOME="/home/appuser",PYTHONPATH="/app",MINIDLNA_HOST="localhost",MINIDLNA_PORT="8200"
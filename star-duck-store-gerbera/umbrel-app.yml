manifestVersion: 1
id: star-duck-store-gerbera
name: Gerbera DLNA
tagline: Servidor DLNA/UPnP para transmitir filmes, músicas e fotos para Smart TVs
icon: https://raw.githubusercontent.com/danilofcosta/Star-Duck-Store/master/star-duck-store-gerbera/logo.png
category: Media
version: "3.3.0"
port: 8200
description: >-
  Gerbera é um servidor de mídia UPnP/DLNA moderno e de alta performance que
  permite transmitir seus vídeos, músicas e fotos armazenados no Umbrel diretamente
  para Smart TVs, consoles (PlayStation/Xbox), receivers e players DLNA da sua rede local.


  Diferente de outros servidores que rodam isolados em bridges virtuais, este app
  utiliza modo de rede host (`network_mode: host`) para permitir que o protocolo SSDP
  (multicast UDP 1900) responda nativamente e instantaneamente nas TVs da sua casa.


  Suas mídias podem ser colocadas diretamente na pasta da aplicação (`${APP_DATA_DIR}/data/media`)
  ou acessadas da pasta de downloads padrão do Umbrel (`/mnt/umbrel-downloads`).

developer: Gerbera Team
website: https://gerbera.io
submitter: Danilo Costa
submission: https://github.com/danilofcosta/Star-Duck-Store
repo: https://github.com/gerbera/gerbera
support: https://github.com/gerbera/gerbera/issues
gallery:
  - https://raw.githubusercontent.com/danilofcosta/Star-Duck-Store/master/star-duck-store-gerbera/gallery/1.png
path: ""
defaultUsername: ""
defaultPassword: ""
torOnly: false
permissions:
  - STORAGE_DOWNLOADS

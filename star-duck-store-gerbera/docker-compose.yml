services:
  server:
    image: gerbera/gerbera:3.3.0
    restart: on-failure
    network_mode: host
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
      - IMAGE_PORT=50500
    volumes:
      - ${APP_DATA_DIR}/data/config:/var/run/gerbera
      - ${APP_DATA_DIR}/data/media:/mnt/content
      - ${UMBREL_ROOT}/data/storage/downloads:/mnt/umbrel-downloads:ro
